<style>
  /* light theme */
  html[data-theme="light"]{
    --page:#f6f7f9; --surface:#ffffff; --surface-2:#eef1f5;
    --ink:#0f1526; --ink-2:#48505f; --muted:#7b8493;
    --grid:#e6e9ef; --axis:#c7ccd6; --border:rgba(15,21,38,0.10);
    --good:#0a8f3c; --bad:#d64545;
    --s1:#5b5bef; --s2:#f59e0b; --s3:#10b981; --s4:#0ea5e9;
    --s5:#ec4899; --s6:#8b5cf6; --s7:#f97316; --s8:#ef4444; --s9:#14b8a6;
    --accent:#5b5bef; --ring:rgba(91,91,239,.35);
    color-scheme:light;
  }
  /* dark theme — the default */
  :root, html[data-theme="dark"]{
    --page:#0b0e14; --surface:#141a23; --surface-2:#1d2530;
    --ink:#eef2f8; --ink-2:#aab3c1; --muted:#7b8493;
    --grid:#232c39; --axis:#33404f; --border:rgba(255,255,255,0.09);
    --good:#3ddc84; --bad:#ff6b6b;
    --s1:#7c7cff; --s2:#f59e0b; --s3:#10b981; --s4:#38bdf8;
    --s5:#ec4899; --s6:#a78bfa; --s7:#fb923c; --s8:#ef4444; --s9:#2dd4bf;
    --accent:#7c7cff; --ring:rgba(124,124,255,.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
  a{color:var(--s1)}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;margin-bottom:6px}
  h1{font-size:20px;margin:0;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600}
  .seg button.active{background:var(--s1);color:#fff}
  select,.btn{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--s1)}
  .fxbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:8px 14px;margin:10px 0 16px;font-size:12.5px}
  .fxbar b{font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
  nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  nav.tabs button{border:0;background:transparent;color:var(--ink-2);padding:9px 13px;font-size:13.5px;cursor:pointer;
    border-bottom:2px solid transparent;font-weight:600}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--s1)}
  .view{display:none}
  .view.active{display:block}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .kpi .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .sub2{font-size:12px;color:var(--ink-2);margin-top:3px;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h3{margin:0 0 12px;font-size:14px;font-weight:700}
  .card h3 .hint{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;cursor:default}
  tbody tr:hover{background:var(--surface-2)}

</style>

<body>

<script type="text/plain" id="__appcode">
let DATA = window.__DATA;
const ORIGINAL_DATA = JSON.parse(JSON.stringify(DATA));

/* ---------------- state ---------------- */
const state = {
  ccy: 'USD',
  account: 'ALL',
  arsRate: DATA.fx.ars_rate_selected || 'mep',
  fx: JSON.parse(JSON.stringify(DATA.fx)),
  fxSource: 'seed',
  fxDate: DATA.meta.notes.includes('2026-07-29') ? '2026-07-29 (seed)' : 'seed'
};

const CCY_SYM = {USD:'$', EUR:'€', ARS:'$'};
const CLASS_COLORS = {
  'Global Equities':'--s1','Argentine Equities':'--s2','Funds':'--s9','International Bonds':'--s3',
  'Argentine Bonds':'--s4','Structured Products':'--s5','Options':'--s6',
  'Futures':'--s7','Cash':'--s8'
};

/* ---------------- fx helpers ---------------- */
function perUSD(ccy){
  if(ccy==='USD') return 1;
  if(ccy==='EUR') return state.fx.EUR_per_USD;
  if(ccy==='GBP') return state.fx.GBP_per_USD;
  if(ccy==='ARS') return state.fx.ars_rates[state.arsRate];
  return 1;
}
const toUSD = (amt,ccy)=> amt / perUSD(ccy);
const fromUSD = (usd,ccy)=> usd * perUSD(ccy);
function disp(usd){ return fromUSD(usd, state.ccy); }
/* convert a USD amount into the display currency using a SPECIFIC fx snapshot
   (so historical values use the rate that applied on their own date) */
function perUSDat(fxObj,ccy){
  if(ccy==='USD') return 1;
  if(ccy==='EUR') return fxObj.EUR_per_USD;
  if(ccy==='ARS') return (fxObj.ars_rates||{})[state.arsRate];
  return 1;
}
function dispAt(usd,fxObj){ return usd * perUSDat(fxObj, state.ccy); }
function fmt(usd, dec){
  const v = disp(usd);
  const d = dec===undefined ? (state.ccy==='ARS'?0:2) : dec;
  const s = v<0?'-':'';
  return s + CCY_SYM[state.ccy] + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtNum(v,d){d=d||0;return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function pct(x){return (x*100).toFixed(1)+'%';}

/* ---------------- dates / accrual ---------------- */
const MS_DAY = 86400000;
function today(){ const d=new Date(); return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
function pdate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d)); }
function daysBetween(a,b){ return Math.round((b-a)/MS_DAY); }
function daysSince(s){ return daysBetween(pdate(s), today()); }
function daysUntil(s){ return daysBetween(today(), pdate(s)); }

/* ---------------- computed models ---------------- */
function equities(list){
  let rows=list.map(p=>{
    const mvC=p.qty*p.price, costC=p.qty*p.avg_cost;
    const mvU=toUSD(mvC,p.ccy), costU=toUSD(costC,p.ccy);
    const soy=p.price_soy||p.price;
    return {...p, mvC, mvU, pnlU:mvU-costU, pnlPct: costU? (mvU-costU)/costU:0,
      ytd: soy? (p.price-soy)/soy : 0};
  });
  const tot=rows.reduce((s,r)=>s+r.mvU,0);
  rows.forEach(r=>r.w= tot? r.mvU/tot:0);
  return {rows, tot, pnl:rows.reduce((s,r)=>s+r.pnlU,0)};
}
/* Yield-to-maturity (bisection) + Macaulay/modified duration, even-period approximation */
function bondAnalytics(b){
  const price=b.face*b.price_pct/100;
  const f=b.freq_per_yr, cpn=b.face*(b.coupon_pct/100)/f;
  const yrs=Math.max(daysUntil(b.maturity),1)/365.25;
  const n=Math.max(1,Math.round(yrs*f));
  const pv=(y)=>{ let s=0; const per=y/f; for(let k=1;k<=n;k++) s+=cpn/Math.pow(1+per,k); s+=b.face/Math.pow(1+per,n); return s; };
  let lo=-0.95, hi=3.0, y=0.05;
  if(pv(lo)<price){ y=lo; } else if(pv(hi)>price){ y=hi; }
  else { for(let i=0;i<80;i++){ y=(lo+hi)/2; (pv(y)>price)? lo=y : hi=y; } }
  const per=y/f; let mac=0; for(let k=1;k<=n;k++) mac+=(k/f)*(cpn/Math.pow(1+per,k)); mac+=(n/f)*(b.face/Math.pow(1+per,n));
  mac=price? mac/price:0; const mod=mac/(1+per);
  return {ytm:y, dur:mac, mdur:mod};
}
function bonds(list){
  let rows=list.map(b=>{
    const cleanC=b.face*b.price_pct/100;
    const accC=b.face*(b.coupon_pct/100)*daysSince(b.last_coupon)/365;
    const cost=b.cost_pct!=null?b.cost_pct:b.price_pct;
    const pnlU=toUSD(b.face*(b.price_pct-cost)/100, b.ccy);
    const soy=b.price_pct_soy||b.price_pct;
    const an=bondAnalytics(b);
    return {...b, cleanC, accC, dirtyU:toUSD(cleanC+accC,b.ccy), accU:toUSD(accC,b.ccy),
      cleanU:toUSD(cleanC,b.ccy), costU:toUSD(b.face*cost/100,b.ccy), pnlU,
      dToNext:daysUntil(b.next_coupon),
      nextAmtU:toUSD(b.face*(b.coupon_pct/100)/b.freq_per_yr,b.ccy),
      ytm:an.ytm, dur:an.dur, mdur:an.mdur, ytd: soy? (b.price_pct-soy)/soy : 0};
  });
  const tot=rows.reduce((s,r)=>s+r.dirtyU,0);
  const wmdur=tot? rows.reduce((s,r)=>s+r.mdur*r.dirtyU,0)/tot : 0;
  return {rows, tot, acc:rows.reduce((s,r)=>s+r.accU,0), pnl:rows.reduce((s,r)=>s+r.pnlU,0), wmdur};
}
function fundsModel(list){
  let rows=list.map(p=>{ const mvC=p.units*p.nav, costC=p.units*(p.cost_nav!=null?p.cost_nav:p.nav);
    const mvU=toUSD(mvC,p.ccy), costU=toUSD(costC,p.ccy); const soy=p.nav_soy||p.nav;
    return {...p, mvU, pnlU:mvU-costU, pnlPct: costU?(mvU-costU)/costU:0, ytd: soy?(p.nav-soy)/soy:0};});
  const tot=rows.reduce((s,r)=>s+r.mvU,0); rows.forEach(r=>r.w= tot? r.mvU/tot:0);
  return {rows, tot, pnl:rows.reduce((s,r)=>s+r.pnlU,0)};
}
function structured(list){
  let rows=list.map(s=>{
    const accC=s.notional*(s.accrual_pct/100)*daysSince(s.last_coupon)/365;
    const mark=s.mark_pct!=null?s.mark_pct:100, cost=s.cost_pct!=null?s.cost_pct:100;
    const markC=s.notional*mark/100;
    const pnlU=toUSD(s.notional*(mark-cost)/100, s.ccy);
    return {...s, accC, valU:toUSD(markC+accC,s.ccy), accU:toUSD(accC,s.ccy), pnlU, mark,
      dToNext:daysUntil(s.next_coupon), nextAmtU:toUSD(s.notional*(s.accrual_pct/100)/s.freq_per_yr,s.ccy)};
  });
  return {rows, tot:rows.reduce((s,r)=>s+r.valU,0), acc:rows.reduce((s,r)=>s+r.accU,0), pnl:rows.reduce((s,r)=>s+r.pnlU,0)};
}
function options(list){
  let rows=list.map(o=>{
    const pnlU=(o.price-o.entry_premium)*o.contracts*o.multiplier/perUSD(o.ccy);
    const premU=Math.abs(o.entry_premium*o.contracts*o.multiplier)/perUSD(o.ccy);   // premium paid/received
    return {...o, mvU:o.contracts*o.multiplier*o.price/perUSD(o.ccy), pnlU,
      pnlPct: premU? pnlU/premU : 0, dToExp:daysUntil(o.expiry)};
  });
  return {rows, tot:rows.reduce((s,r)=>s+r.mvU,0), pnl:rows.reduce((s,r)=>s+r.pnlU,0)};
}
function futures(list){
  let rows=list.map(f=>({...f,
    notU:f.qty*f.price*f.multiplier/perUSD(f.ccy),
    pnlU:(f.price-f.entry_price)*f.qty*f.multiplier/perUSD(f.ccy),
    marginU:f.margin/perUSD(f.ccy)}));
  return {rows, tot:rows.reduce((s,r)=>s+r.pnlU,0), margin:rows.reduce((s,r)=>s+r.marginU,0),
    notional:rows.reduce((s,r)=>s+r.notU,0)};
}
function loans(list){
  let rows=list.map(l=>{
    const accC=l.principal*(l.rate_pct/100)*daysSince(l.start_date)/365;
    return {...l, accC, owedC:l.principal+accC, owedU:toUSD(l.principal+accC,l.ccy)};
  });
  return {rows, tot:rows.reduce((s,r)=>s+r.owedU,0)};
}
function acctOK(x){ return state.account==='ALL' || x.account===state.account; }
function ledgerFiltered(){ return DATA.ledger.filter(acctOK); }
function cash(){
  const ccys=['USD','EUR','ARS'];
  const led=ledgerFiltered();
  const rows=ccys.map(cc=>{
    const bal=led.filter(t=>t.ccy===cc).reduce((s,t)=>s+t.cash_flow,0);
    return {ccy:cc, bal, usd:toUSD(bal,cc)};
  }).filter(r=>Math.abs(r.bal)>0.0001);
  return {rows, tot:rows.reduce((s,r)=>s+r.usd,0)};
}
function ledgerRows(){
  const led=[...ledgerFiltered()].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  const run={};  // running balance keyed by account + currency
  return led.map(t=>{
    const k=(t.account||'')+'|'+t.ccy;
    run[k]=(run[k]||0)+t.cash_flow;
    return {...t, usd:toUSD(t.cash_flow,t.ccy), running:run[k]};
  });
}

/* Realized P&L from the ledger — average-cost method, per instrument.
   Buys add to cost pool; sells realize (proceeds − avg cost × qty sold).
   Options/futures excluded (their P&L is marked-to-market, shown as unrealized). */
function realizedPnL(){
  const led=[...ledgerFiltered()].sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  const pool={}; // instrument -> {qty, cost} in native ccy
  const events=[];
  const EXCL=new Set(['Options','Futures']);
  led.forEach(t=>{
    if(t.qty==null) return;
    const k=(t.account||'')+'|'+t.instrument;
    if(!pool[k]) pool[k]={qty:0,cost:0,ccy:t.ccy};
    if(t.type==='Buy'){ pool[k].qty+=t.qty; pool[k].cost+=Math.abs(t.cash_flow); }
    else if(t.type==='Sell' && !EXCL.has(t.asset_class)){
      const p=pool[k]; const avg= p.qty>0? p.cost/p.qty : 0;
      const costOut=avg*t.qty; const proceeds=Math.abs(t.cash_flow);
      const realC=proceeds-costOut;
      p.qty-=t.qty; p.cost-=costOut;
      events.push({date:t.date, instrument:k, cls:t.asset_class, ccy:t.ccy, qty:t.qty,
        proceeds, cost:costOut, realizedC:realC, realizedU:toUSD(realC,t.ccy)});
    }
  });
  return {events, tot:events.reduce((s,e)=>s+e.realizedU,0)};
}

function buildModel(){
  const F=acctOK;
  const eg=equities(DATA.equities_global.filter(F));
  const ea=equities(DATA.equities_arg.filter(F));
  const bi=bonds(DATA.bonds_intl.filter(F));
  const ba=bonds(DATA.bonds_arg.filter(F));
  const st=structured(DATA.structured.filter(F));
  const op=options(DATA.options.filter(F));
  const fu=futures(DATA.futures.filter(F));
  const ln=loans(DATA.loans.filter(F));
  const fn=fundsModel((DATA.funds||[]).filter(F));
  const ch=cash();
  const classes=[
    ['Global Equities',eg.tot],['Argentine Equities',ea.tot],['Funds',fn.tot],['International Bonds',bi.tot],
    ['Argentine Bonds',ba.tot],['Structured Products',st.tot],['Options',op.tot],
    ['Futures',fu.tot],['Cash',ch.tot]
  ];
  const gross=classes.reduce((s,c)=>s+c[1],0);
  const liab=ln.tot;
  const net=gross-liab;
  const accrued=bi.acc+ba.acc+st.acc;
  // unrealized P&L across every asset class
  const unrealByClass=[
    ['Global Equities',eg.pnl],['Argentine Equities',ea.pnl],['Funds',fn.pnl],['International Bonds',bi.pnl],
    ['Argentine Bonds',ba.pnl],['Structured Products',st.pnl],['Options',op.pnl],['Futures',fu.tot]
  ];
  const unreal=unrealByClass.reduce((s,c)=>s+c[1],0);
  const rz=realizedPnL();
  const income=ledgerFiltered().filter(t=>t.type==='Coupon'||t.type==='Dividend').reduce((a,t)=>a+toUSD(t.cash_flow,t.ccy),0);
  return {eg,ea,bi,ba,st,op,fu,ln,fn,ch,classes,gross,liab,net,accrued,
    unrealByClass,unreal,realized:rz.tot,realizedEvents:rz.events,income,totalPnl:unreal};
}

/* ===================== ADVANCED ANALYTICS ===================== */
const RF=()=>((DATA.config||{}).risk_free_pct||4)/100;
function fullNetUSD(){ const s=state.account; state.account='ALL'; const n=buildModel().net; state.account=s; return n; }

/* --- Black-Scholes Greeks --- */
function normPdf(x){ return 0.3989422804014327*Math.exp(-x*x/2); }
function normCdf(x){ const t=1/(1+0.2316419*Math.abs(x)); const d=normPdf(x);
  let p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return x>0? 1-p : p; }
function optGreeks(o){
  const S=o.spot||o.strike, K=o.strike, sig=o.iv||0.25, r=RF();
  const T=Math.max(daysUntil(o.expiry),0)/365, call=(o.type==='Call');
  if(T<=0||sig<=0){ const intr=call?Math.max(S-K,0):Math.max(K-S,0); return {delta:call?(S>K?1:0):(S<K?-1:0),gamma:0,vega:0,theta:0,price:intr}; }
  const d1=(Math.log(S/K)+(r+sig*sig/2)*T)/(sig*Math.sqrt(T)), d2=d1-sig*Math.sqrt(T);
  const delta=call? normCdf(d1) : normCdf(d1)-1;
  const gamma=normPdf(d1)/(S*sig*Math.sqrt(T));
  const vega=S*normPdf(d1)*Math.sqrt(T)/100;                     // per 1 vol point
  const theta=(-(S*normPdf(d1)*sig)/(2*Math.sqrt(T)) - (call?1:-1)*r*K*Math.exp(-r*T)*normCdf(call?d2:-d2))/365; // per day
  const price=call? S*normCdf(d1)-K*Math.exp(-r*T)*normCdf(d2) : K*Math.exp(-r*T)*normCdf(-d2)-S*normCdf(-d1);
  return {delta,gamma,vega,theta,price};
}
function optionsWithGreeks(){
  return DATA.options.filter(acctOK).map(o=>{ const g=optGreeks(o); const m=o.contracts*o.multiplier;
    return {...o, g, deltaSh:g.delta*m, deltaUSD:g.delta*m*(o.spot||o.strike)/perUSD(o.ccy),
      gammaUSD:g.gamma*m*(o.spot||o.strike)/perUSD(o.ccy), thetaUSD:g.theta*m/perUSD(o.ccy),
      vegaUSD:g.vega*m/perUSD(o.ccy), mvU:o.contracts*o.multiplier*o.price/perUSD(o.ccy),
      notionalU:Math.abs(m)*(o.spot||o.strike)/perUSD(o.ccy)}; });
}
function portfolioGreeks(){
  const ows=optionsWithGreeks();
  return {deltaUSD:ows.reduce((s,o)=>s+o.deltaUSD,0), gammaUSD:ows.reduce((s,o)=>s+o.gammaUSD,0),
    thetaUSD:ows.reduce((s,o)=>s+o.thetaUSD,0), vegaUSD:ows.reduce((s,o)=>s+o.vegaUSD,0), rows:ows};
}

/* --- risk metrics from the net-worth snapshot series (respects account filter) --- */
function riskSeriesUSD(){
  const acct=state.account; const snaps=[...DATA.snapshots].sort((a,b)=>a.date<b.date?-1:1);
  const vals=snaps.map(sp=> acct==='ALL'? sp.net_worth_usd : ((sp.by_account||{})[acct]||0));
  vals.push(acct==='ALL'? fullNetUSD() : (buildModel().net));
  return vals;
}
function riskMetrics(){
  const snaps=[...DATA.snapshots].sort((a,b)=>a.date<b.date?-1:1);
  const dates=snaps.map(s=>s.date).concat([today().toISOString().slice(0,10)]);
  const v=riskSeriesUSD();
  const rets=[]; for(let i=1;i<v.length;i++) if(v[i-1]) rets.push(v[i]/v[i-1]-1);
  const n=rets.length||1; const mean=rets.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(rets.reduce((a,b)=>a+(b-mean)*(b-mean),0)/Math.max(1,n-1));
  // periods-per-year from the ACTUAL average spacing of snapshots (not a hardcoded 12)
  const spanDays=Math.max(1,daysBetween(pdate(dates[0]),pdate(dates[dates.length-1])));
  const ppy = n>0 ? 365/(spanDays/n) : 12;
  const rfP = RF()/ppy;                                   // per-period risk-free
  const volAnn=sd*Math.sqrt(ppy);
  // annualized Sharpe = (mean periodic excess return / periodic stdev) * sqrt(periods)
  const sharpe = sd ? ((mean-rfP)/sd)*Math.sqrt(ppy) : Infinity;
  const dn=rets.filter(x=>x<rfP).map(x=>x-rfP);
  const ddev=Math.sqrt(dn.reduce((a,b)=>a+b*b,0)/Math.max(1,n));   // downside deviation (periodic)
  const sortino = ddev ? ((mean-rfP)/ddev)*Math.sqrt(ppy) : Infinity;
  const totRet = v[0]? v[v.length-1]/v[0]-1 : 0;
  const cagr=(spanDays>0)? Math.pow(1+totRet,365/spanDays)-1 : 0;
  let peak=v[0],maxDD=0; v.forEach(x=>{ if(x>peak)peak=x; const dd=peak? (x-peak)/peak:0; if(dd<maxDD)maxDD=dd; });
  const best=Math.max(...rets), worst=Math.min(...rets);
  const smooth = (maxDD===0 && rets.filter(x=>x<0).length===0);
  return {volAnn,cagr,maxDD,sharpe,sortino,best,worst,n,smooth,ppy};
}

/* --- forward income projection + maturity ladder --- */
function projectIncome(monthsAhead){
  const out=[]; const start=today(); const end=new Date(start); end.setUTCMonth(end.getUTCMonth()+monthsAhead);
  const addStream=(nextStr,matStr,freq,amtCcy,ccy,name,account,typ)=>{
    if(!nextStr||!freq||!amtCcy) return; let dt=pdate(nextStr); const mat=matStr?pdate(matStr):end;
    const step=Math.max(1,Math.round(12/freq)); let g=0;
    while(dt<=end && dt<=mat && g++<80){ if(dt>=start) out.push({date:dt.toISOString().slice(0,10),instrument:name,account,type:typ,amountU:toUSD(amtCcy,ccy),ccy}); const nx=new Date(dt); nx.setUTCMonth(nx.getUTCMonth()+step); dt=nx; }
  };
  DATA.bonds_intl.concat(DATA.bonds_arg).filter(acctOK).forEach(b=>addStream(b.next_coupon,b.maturity,b.freq_per_yr,b.face*(b.coupon_pct/100)/b.freq_per_yr,b.ccy,b.id,b.account,'Coupon'));
  DATA.structured.filter(acctOK).forEach(s=>addStream(s.next_coupon,s.maturity,s.freq_per_yr,s.notional*(s.accrual_pct/100)/s.freq_per_yr,s.ccy,s.id,s.account,'Note coupon'));
  DATA.equities_global.concat(DATA.equities_arg).filter(acctOK).forEach(p=>{ if(p.annual_div_ps&&p.div_freq&&p.next_div) addStream(p.next_div,null,p.div_freq,p.qty*p.annual_div_ps/p.div_freq,p.ccy,p.ticker,p.account,'Dividend'); });
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function incomeByMonth(){
  const evs=projectIncome(12); const m={};
  evs.forEach(e=>{ const k=e.date.slice(0,7); (m[k]=m[k]||{key:k,total:0,items:[]}); m[k].total+=e.amountU; m[k].items.push(e); });
  return Object.values(m).sort((a,b)=>a.key<b.key?-1:1);
}
function maturityLadder(){
  const items=DATA.bonds_intl.concat(DATA.bonds_arg).filter(acctOK).map(b=>({name:b.id,year:(b.maturity||'').slice(0,4),principalU:toUSD(b.face,b.ccy),ccy:b.ccy,type:'Bond',account:b.account,mat:b.maturity}))
    .concat(DATA.structured.filter(acctOK).map(s=>({name:s.id,year:(s.maturity||'').slice(0,4),principalU:toUSD(s.notional,s.ccy),ccy:s.ccy,type:'Note',account:s.account,mat:s.maturity})));
  const y={}; items.forEach(it=>{ (y[it.year]=y[it.year]||{year:it.year,total:0,items:[]}); y[it.year].total+=it.principalU; y[it.year].items.push(it); });
  return {byYear:Object.values(y).sort((a,b)=>a.year<b.year?-1:1), items};
}

/* ---------------- SVG donut ---------------- */
function donut(items){ // items:[{label,value,color}]
  const total=items.reduce((s,i)=>s+Math.max(0,i.value),0)||1;
  const R=78,r=48,cx=95,cy=95;let a=-Math.PI/2;
  let paths='';
  items.forEach(it=>{
    const v=Math.max(0,it.value), frac=v/total, a2=a+frac*2*Math.PI;
    if(frac<=0) return;
    const large=frac>0.5?1:0;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi1=cx+r*Math.cos(a2),yi1=cy+r*Math.sin(a2),xi2=cx+r*Math.cos(a),yi2=cy+r*Math.sin(a);
    paths+=`<path d="M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${xi1} ${yi1} A${r} ${r} 0 ${large} 0 ${xi2} ${yi2} Z" fill="var(${it.color})" stroke="var(--surface)" stroke-width="2"><title>${it.label}: ${fmt(it.value)} (${pct(frac)})</title></path>`;
    a=a2;
  });
  return `<svg viewBox="0 0 190 190" width="190" height="190" role="img">${paths}</svg>`;
}

/* ---------------- SVG line chart ---------------- */
function lineChart(points){ // points:[{date,value}] value ALREADY in display ccy (per-date fx)
  const W=560,H=200,padL=54,padR=14,padT=14,padB=28;
  const xs=points.map(p=>pdate(p.date).getTime());
  const ys=points.map(p=>p.value);
  const xmin=Math.min(...xs),xmax=Math.max(...xs);
  const ymin=Math.min(...ys),ymax=Math.max(...ys);
  const ylo=ymin-(ymax-ymin)*0.12, yhi=ymax+(ymax-ymin)*0.12;
  const X=t=>padL+(xmax===xmin?0:(t-xmin)/(xmax-xmin))*(W-padL-padR);
  const Y=v=>padT+(yhi===ylo?0:(1-(v-ylo)/(yhi-ylo)))*(H-padT-padB);
  let d=''; points.forEach((p,i)=>{d+=(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(ys[i]).toFixed(1)+' ';});
  const area=d+`L${X(xmax).toFixed(1)} ${Y(ylo).toFixed(1)} L${X(xmin).toFixed(1)} ${Y(ylo).toFixed(1)} Z`;
  const gy=[ylo,(ylo+yhi)/2,yhi].map(v=>`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W-padR}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${padL-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="10">${CCY_SYM[state.ccy]}${(v/1000).toFixed(0)}k</text>`).join('');
  const dots=points.map((p,i)=>`<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(ys[i]).toFixed(1)}" r="3" fill="var(--s1)"><title>${p.date}: ${CCY_SYM[state.ccy]}${fmtNum(p.value,0)}</title></circle>`).join('');
  const xlab=[points[0],points[points.length-1]].map(p=>`<text x="${X(pdate(p.date).getTime()).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10">${p.date}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" preserveAspectRatio="xMidYMid meet">
    ${gy}<path d="${area}" fill="var(--s1)" opacity="0.10"/><path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2"/>${dots}${xlab}</svg>`;
}

function consolidateByTicker(list){
  const g={};
  list.forEach(r=>{ const k=r.ticker;
    if(!g[k]) g[k]={...r, accounts:new Set([r.account])};
    else { const o=g[k]; const nq=o.qty+r.qty;
      o.avg_cost = nq? (o.qty*o.avg_cost+r.qty*r.avg_cost)/nq : r.avg_cost;
      o.qty=nq; o.mvU+=r.mvU; o.pnlU+=r.pnlU; o.accounts.add(r.account); }
  });
  const rows=Object.values(g); const tot=rows.reduce((s,r)=>s+r.mvU,0);
  rows.forEach(r=>{ r.w= tot? r.mvU/tot:0; const cost=r.mvU-r.pnlU; r.pnlPct= cost? r.pnlU/cost:0; });
  return rows;
}

// Each snapshot carries the FX that applied ON ITS DATE, so a value shown in
// EUR/ARS uses the period's own rate — not today's. This is the fix for
// "you do not take the price of that currency at the beginning of the period".
let anClass='ALL';   // Analysis-local asset-class selector
let anMode='single'; // 'single' | 'compare'
let anCompareBy='account'; // 'account' | 'class'
let anCompareSet=null;     // Set of ids to plot; null => all
let anCmpStart=null, anCmpEnd=null;   // compare window (default year_start..today)
let anBench='none';        // 'none' | 'sp500' | 'hurdle'
let groupByInstrument=false; // equities: consolidate same ticker across accounts
const SERIES_COLORS=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const ANALYSIS_CLASSES=['Global Equities','Argentine Equities','Funds','International Bonds',
  'Argentine Bonds','Structured Products','Options','Futures','Cash'];
// multi-series indexed line chart (each series rebased to 100 at its first point)
function multiLineChart(seriesList){
  const W=560,H=240,padL=42,padR=16,padT=14,padB=34;
  const all=seriesList.flatMap(s=>s.pts); if(!all.length) return '';
  const xs=all.map(p=>pdate(p.date).getTime());
  const xmin=Math.min(...xs),xmax=Math.max(...xs);
  let ymin=Math.min(...all.map(p=>p.idx)),ymax=Math.max(...all.map(p=>p.idx));
  const pad=(ymax-ymin)*0.1||1; ymin-=pad; ymax+=pad;
  const X=t=>padL+((t-xmin)/((xmax-xmin)||1))*(W-padL-padR);
  const Y=v=>padT+(1-(v-ymin)/((ymax-ymin)||1))*(H-padT-padB);
  const gy=[ymin,(ymin+ymax)/2,ymax].map(v=>`<line x1="${padL}" y1="${Y(v).toFixed(1)}" x2="${W-padR}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${padL-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="10">${v.toFixed(0)}</text>`).join('');
  const base100 = (ymin<100&&ymax>100)?`<line x1="${padL}" y1="${Y(100).toFixed(1)}" x2="${W-padR}" y2="${Y(100).toFixed(1)}" stroke="var(--axis)" stroke-dasharray="3 3"/>`:'';
  const paths=seriesList.map(s=>{ let d=''; s.pts.forEach((p,i)=>{d+=(i?'L':'M')+X(pdate(p.date).getTime()).toFixed(1)+' '+Y(p.idx).toFixed(1)+' ';});
    const last=s.pts[s.pts.length-1];
    const dash=s.dashed?' stroke-dasharray="5 4"':'';
    return `<path d="${d}" fill="none" stroke="var(${s.color})" stroke-width="${s.dashed?2:2}"${dash}><title>${s.name}</title></path>`+
      `<circle cx="${X(pdate(last.date).getTime()).toFixed(1)}" cy="${Y(last.idx).toFixed(1)}" r="3.2" fill="var(${s.color})"><title>${s.name}: ${last.idx.toFixed(1)}</title></circle>`;
  }).join('');
  const xl=[all[0],all[all.length-1]].map(()=>0); // labels
  const lab=`<text x="${padL}" y="${H-8}" font-size="10">${seriesList[0].pts[0].date}</text>`+
    `<text x="${W-padR}" y="${H-8}" text-anchor="end" font-size="10">${seriesList[0].pts[seriesList[0].pts.length-1].date}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet">${gy}${base100}${paths}${lab}</svg>`;
}
// live per-account and per-class net worth (USD), for the "today" endpoint of any slice
function liveBreakdowns(){
  const saved=state.account; state.account='ALL'; const mAll=buildModel(); state.account=saved;
  const byClass=Object.fromEntries(mAll.classes); byClass['Loans']=-mAll.liab;
  const accts=accountBreakdown(); // [{id,net,classMap,liab}]
  const byAcct=Object.fromEntries(accts.map(a=>[a.id,a.net]));
  const acctClass={}; accts.forEach(a=>{ acctClass[a.id]={...a.classMap, Loans:-a.liab}; });
  return {total:mAll.net, byClass, byAcct, acctClass};
}
// USD value of the selected (account × class) slice at a historical snapshot
function sliceHistUSD(sp, acct, klass, live){
  if(acct==='ALL' && klass==='ALL') return sp.net_worth_usd;
  if(acct!=='ALL' && klass==='ALL') return (sp.by_account||{})[acct] ?? 0;
  if(acct==='ALL' && klass!=='ALL') return (sp.by_class||{})[klass] ?? 0;
  const base=(sp.by_account||{})[acct] ?? 0;                 // intersection: scale account path
  const share = live.byAcct[acct] ? ((live.acctClass[acct]||{})[klass]||0)/live.byAcct[acct] : 0;
  return base*share;
}
function sliceLiveUSD(acct, klass, live){
  if(acct==='ALL' && klass==='ALL') return live.total;
  if(acct!=='ALL' && klass==='ALL') return live.byAcct[acct]||0;
  if(acct==='ALL' && klass!=='ALL') return live.byClass[klass]||0;
  return (live.acctClass[acct]||{})[klass]||0;
}
function snapshotSeries(acct, klass){
  const live=liveBreakdowns();
  const s=DATA.snapshots.map(x=>({date:x.date, usd:sliceHistUSD(x,acct,klass,live),
    fx:x.fx||{EUR_per_USD:state.fx.EUR_per_USD, ars_rates:state.fx.ars_rates}}));
  s.push({date:today().toISOString().slice(0,10), usd:sliceLiveUSD(acct,klass,live), fx:state.fx});
  s.sort((a,b)=> a.date<b.date?-1:1);
  s.forEach(p=>{ p.value = dispAt(p.usd, p.fx); });   // display ccy at each point's own fx
  return s;
}
function pointAt(series,dateStr){
  let p=series[0];
  for(const q of series){ if(q.date<=dateStr) p=q; else break; }
  return p;
}
// build one indexed series per account or asset class, rebased to 100 at window start [a,b]
function windowIndex(fullPts, a, b){
  const base = pointAt(fullPts, a).value || 1;                 // value at/just before window start
  const inWin = fullPts.filter(p=>p.date>=a && p.date<=b);
  const pts = (inWin.length && inWin[0].date===a) ? inWin : [{date:a, value:base}, ...inWin];
  pts.forEach(p=>p.idx = 100*p.value/base);
  const endVal = pointAt(fullPts, b).value;
  return {pts, ret: base? endVal/base-1 : 0, now:endVal};
}
function compareSeries(by, ids, a, b){
  const live=liveBreakdowns();
  const snaps=[...DATA.snapshots].sort((x,y)=> x.date<y.date?-1:1);
  const tdy=today().toISOString().slice(0,10);
  return ids.map((id,i)=>{
    const full=snaps.map(sp=>{
      const usd = by==='account'? ((sp.by_account||{})[id]||0) : ((sp.by_class||{})[id]||0);
      const fx=sp.fx||{EUR_per_USD:state.fx.EUR_per_USD,ars_rates:state.fx.ars_rates};
      return {date:sp.date, value:dispAt(usd,fx)};
    });
    full.push({date:tdy, value:dispAt(by==='account'?(live.byAcct[id]||0):(live.byClass[id]||0), state.fx)});
    const w=windowIndex(full, a, b);
    return {id, name: by==='account'?ACCT_NAME(id):id, color:SERIES_COLORS[i%8], pts:w.pts, now:w.now, ytd:w.ret};
  });
}
// benchmark series over the same window (S&P 500 index, or a fixed hurdle rate)
function benchmarkSeries(a, b){
  if(anBench==='none') return null;
  const snaps=[...DATA.snapshots].sort((x,y)=> x.date<y.date?-1:1);
  const tdy=today().toISOString().slice(0,10);
  if(anBench==='sp500'){
    const full=snaps.filter(sp=>sp.sp500!=null).map(sp=>({date:sp.date, value:sp.sp500}));
    const nowLvl=(DATA.benchmarks||{}).sp500_now; if(nowLvl) full.push({date:tdy, value:nowLvl});
    if(full.length<2) return null;
    const w=windowIndex(full, a, b);
    return {id:'__bench', name:'S&P 500', color:'--ink-2', dashed:true, pts:w.pts, now:w.now, ytd:w.ret, isBench:true};
  }
  // fixed hurdle: compounding line from 100
  const h=((DATA.benchmarks||{}).hurdle_pct||8)/100;
  const mid=snaps.map(s=>s.date).filter(dt=>dt>a && dt<b);
  const uniq=[...new Set([a, ...mid, (b>tdy?tdy:b)])].sort();
  const pts=uniq.map(dt=>({date:dt, idx:100*Math.pow(1+h, Math.max(0,daysBetween(pdate(a),pdate(dt)))/365)}));
  return {id:'__bench', name:`Hurdle ${(h*100).toFixed(0)}%/yr`, color:'--ink-2', dashed:true, pts, now:null, ytd:pts[pts.length-1].idx/100-1, isBench:true};
}

function computeRange(){
  const s=window.__series; if(!s) return;

  const chart=document.getElementById('anChart');
  const a=document.getElementById('rngStart').value, b=document.getElementById('rngEnd').value;
  if(!a||!b) return;
  const pa=pointAt(s,a), pb=pointAt(s,b);
  const va=pa.value, vb=pb.value;               // both already in display ccy at their own fx
  const ret= va? vb/va-1 : 0;
  const days=Math.max(1,daysBetween(pdate(a),pdate(b)));
  const ann=days>0? Math.pow(1+ret,365/days)-1 : 0;
  // redraw the chart to the selected window (this is what "updates with the range")
  if(chart){

    ` <span class="muted">(${state.ccy} at each date's own rate: ${a} @ ${fmtNum(perUSDat(pa.fx,state.ccy),state.ccy==='ARS'?0:4)}, ${b} @ ${fmtNum(perUSDat(pb.fx,state.ccy),state.ccy==='ARS'?0:4)})</span>`;

    `<div class="barrow" style="grid-template-columns:1fr auto"><span class="muted">Value on ${a}</span><b>${CCY_SYM[state.ccy]}${fmtNum(va,state.ccy==='ARS'?0:2)}</b></div>`+

    `<div class="barrow" style="grid-template-columns:1fr auto"><span class="muted">Return over ${days} days</span><b class="${cls(ret)}">${(ret*100).toFixed(2)}%</b></div>`+
    `<div class="barrow" style="grid-template-columns:1fr auto"><span class="muted">Annualized</span><b class="${cls(ann)}">${(ann*100).toFixed(2)}%</b></div>`+
    (state.ccy!=='USD'?`<div class="note" style="margin-top:8px">Return computed in ${state.ccy} using the FX of each endpoint date${fxNote}.</div>`:'');
}

function opGross(cls_){
  if(cls_.startsWith('Equities')) return gn('opQty')*gn('opPrice');
  if(cls_==='Funds') return gn('opUnits')*gn('opNav');
  if(cls_.startsWith('Bonds')) return gn('opFace')*gn('opPrice')/100;
  if(cls_==='Structured') return gn('opNotional')*(gn('opCost')||100)/100;

/* ---- export an ENCRYPTED portfolio.enc in the browser (matches secure_publish.py) ---- */
function _u8b64(u){ let s=''; const CH=0x8000; for(let i=0;i<u.length;i+=CH) s+=String.fromCharCode.apply(null,u.subarray(i,i+CH)); return btoa(s); }
async function exportEncrypted(){
  let pw = window.__PASSPHRASE || prompt('Enter your dashboard passphrase to encrypt the file:');
  if(!pw) return;
  try{
    const iters=200000, enc=new TextEncoder();
    const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
    const base=await crypto.subtle.importKey('raw', enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iters,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(DATA))));
    const payload={v:1,iters,salt:_u8b64(salt),iv:_u8b64(iv),ct:_u8b64(ct)};
    download('portfolio.enc', JSON.stringify(payload,null,1),'application/json');
    toast('Saved portfolio.enc — upload it to GitHub, then run the refresh workflow.');
  }catch(e){ toast('Encrypt failed: '+(e.message||e)); }
}

function parseCSV(text){
  text=text.replace(/\r\n?/g,'\n'); const rows=[]; let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"') q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else f+=c; } }
  if(f.length||row.length){ row.push(f); rows.push(row); }

  if(/option|call|put/.test(s)) return 'Options';

  if(/struct|autocall|\bnote\b|cln|linked/.test(s)) return 'Structured';
  if(/cash|efectivo|deposit/.test(s)) return 'Cash';
  if(/bond|treasur|ust|corp|cer|bonar|\bgd\d|\bal\d/.test(s)){ return /arg|ars|bonar|cer|\bgd\d|\bal\d|tx\d/.test(s)?'Bonds ARG':'Bonds Intl'; }

      <div class="note">Coupons projected from each instrument's next-coupon date & frequency to maturity; equity dividends from the declared per-share rate.</div></div>
    <div class="card"><h3>Maturity ladder <span class="hint">principal returning by year, ${state.ccy}</span></h3>${ladBars}
      <div class="note">When bonds & structured notes redeem — plan reinvestment around these.</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Upcoming payments <span class="hint">next 16</span></h3>${tableFor(['Date','Instrument','Type','Amount'],upcoming.split('</tr>').filter(Boolean).map(r=>r+'</tr>'))}</div>
    <div class="card"><h3>Maturities</h3>${tableFor(['Instrument','Account','Maturity','Principal'],ladRows.split('</tr>').filter(Boolean).map(r=>r+'</tr>'))}</div>
  </div>`;
}

/* ---------------- Risk (metrics, concentration, exposures, derivatives) ---------------- */
function expoBars(groups, nw, palette){
  const max=Math.max(...groups.map(x=>Math.abs(x.v)),1);
  return groups.map((x,i)=>`<div class="barrow" style="grid-template-columns:150px 1fr 108px">
    <span>${x.k}</span><div class="bartrack"><div class="barfill" style="width:${Math.abs(x.v)/max*100}%;background:var(${palette[i%palette.length]})"></div></div>
    <span style="text-align:right">${fmt(x.v)} · ${((x.v/nw)*100).toFixed(0)}%</span></div>`).join('');
}
function viewRisk(m){
  const r=riskMetrics(), con=concentration(), g=portfolioGreeks();
  const nw=m.net||1;
  const fx=exposureBy('ccy'), sec=exposureBy('sector'), ctry=exposureBy('country');
  const h=holdings();
  const grossLong=h.filter(x=>x.expU>0).reduce((s,x)=>s+x.expU,0);
  const grossShort=h.filter(x=>x.expU<0).reduce((s,x)=>s+x.expU,0);
  const grossExp=grossLong-grossShort, netExp=grossLong+grossShort;
  const PAL=['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
  const conRows=con.rows.slice(0,10).map(x=>`<tr><td>${x.name} <span class="tag">${x.cls}</span> <span class="tag">${x.account}</span></td>
    <td>${fmt(x.mvU)}</td><td>${(x.w*100).toFixed(1)}%</td></tr>`).join('');
  const grk=g.rows.map(o=>`<tr><td>${o.id} <span class="tag">${o.account}</span></td><td>${o.g.delta.toFixed(2)}</td>
    <td>${fmtNum(o.deltaSh,0)}</td><td>${fmt(o.deltaUSD)}</td><td>${fmt(o.thetaUSD)}</td><td>${fmt(o.vegaUSD)}</td></tr>`).join('')
    || '<tr><td colspan="6" class="muted">No option positions in this slice.</td></tr>';
  const rf2=v=>isFinite(v)?v.toFixed(2):'∞';
  const smoothNote = r.smooth ? `<div class="note" style="margin-bottom:14px">Risk metrics use the net-worth snapshot history, which in this template is a smooth synthetic series — so volatility looks low and drawdown is zero. They become meaningful once the connector logs real (noisier) snapshots over time.</div>` : '';
  return `${smoothNote}<div class="kpis">
    <div class="kpi"><div class="lbl">Volatility (ann.)</div><div class="val">${(r.volAnn*100).toFixed(1)}%</div><div class="sub2">of net worth</div></div>
    <div class="kpi"><div class="lbl">Max drawdown</div><div class="val neg">${(r.maxDD*100).toFixed(1)}%</div></div>
    <div class="kpi"><div class="lbl">Sharpe / Sortino</div><div class="val">${rf2(r.sharpe)} / ${rf2(r.sortino)}</div><div class="sub2">vs ${(RF()*100).toFixed(1)}% risk-free</div></div>
    <div class="kpi"><div class="lbl">Gross exposure</div><div class="val">${(grossExp/nw*100).toFixed(0)}%</div><div class="sub2">of net worth · net ${(netExp/nw*100).toFixed(0)}%</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Concentration <span class="hint">largest positions, share of holdings</span></h3>
      ${tableFor(['Position','Market value','Weight'],conRows.split('</tr>').filter(Boolean).map(r=>r+'</tr>'))}
      <div class="note">Top holding ${(con.top1*100).toFixed(0)}% · Top 5 ${(con.top5*100).toFixed(0)}% · HHI ${(con.hhi*10000).toFixed(0)} · effective # of positions ≈ ${con.effN.toFixed(1)}.</div></div>
    <div class="card"><h3>Currency exposure <span class="hint">economic exposure by currency, % of net worth</span></h3>
      ${expoBars(fx,nw,PAL)}
      <div class="note">Note: a USD-denominated Argentine bond counts as USD exposure, not ARS — this is real currency risk, not just where it trades.</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Sector exposure <span class="hint">% of net worth</span></h3>${expoBars(sec,nw,PAL)}</div>
    <div class="card"><h3>Country exposure <span class="hint">% of net worth</span></h3>${expoBars(ctry,nw,PAL)}</div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Options — portfolio Greeks <span class="hint">Black-Scholes, aggregated</span></h3>
      <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
        <div class="kpi"><div class="lbl">Delta ($)</div><div class="val" style="font-size:18px">${fmt(g.deltaUSD)}</div><div class="sub2">≈ ${fmtNum(g.deltaUSD/nw*100,1)}% NW</div></div>
        <div class="kpi"><div class="lbl">Theta ($/day)</div><div class="val ${cls(g.thetaUSD)}" style="font-size:18px">${fmt(g.thetaUSD)}</div></div>
        <div class="kpi"><div class="lbl">Vega ($/vol)</div><div class="val" style="font-size:18px">${fmt(g.vegaUSD)}</div></div>
        <div class="kpi"><div class="lbl">Gamma ($)</div><div class="val" style="font-size:18px">${fmt(g.gammaUSD)}</div></div>
      </div>
      ${tableFor(['Option','Delta','Δ shares','Δ $','Theta/day','Vega'],grk.split('</tr>').filter(Boolean).map(r=>r+'</tr>'))}
      <div class="note">Delta $ = directional exposure (like holding that many $ of the underlying). Theta = daily time decay. Uses each option's spot & implied-vol inputs.</div></div>
    <div class="card"><h3>Exposure & leverage</h3>
      <div class="barrow" style="grid-template-columns:1fr auto"><span class="muted">Gross long exposure</span><b>${fmt(grossLong)}</b></div>
      <div class="barrow" style="grid-template-columns:1fr auto"><span class="muted">Gross short exposure</span><b>${fmt(grossShort)}</b></div>
      <div class="barrow" style="grid-template-columns:1fr auto"><span class="muted">Net exposure</span><b>${fmt(netExp)} · ${(netExp/nw*100).toFixed(0)}% NW</b></div>
      <div class="barrow" style="grid-template-columns:1fr auto"><span class="muted">Gross exposure / net worth</span><b>${(grossExp/nw).toFixed(2)}×</b></div>
      <div class="barrow" style="grid-template-columns:1fr auto"><span class="muted">Loans (leverage)</span><b class="neg">${fmt(-m.liab)}</b></div>
      <div class="note">Gross exposure includes delta-adjusted options and futures notional. >1.0× means you control more market exposure than your net worth — leverage from derivatives and the margin loan.</div></div>
  </div>`;
}

function isBlank(){ return (DATA.accounts||[]).length===0 && allPositions().length===0; }
function viewEmpty(){
  return `<div class="card" style="text-align:center;padding:52px 24px">

    <h3 style="justify-content:center;font-size:18px;margin:14px 0 4px">Start your portfolio</h3>

function render(){
  const m=buildModel();
  document.getElementById('asof').textContent =
    `As of ${today().toISOString().slice(0,10)} · ${state.ccy} · ARS: ${state.arsRate.toUpperCase()} (${fmtNum(state.fx.ars_rates[state.arsRate])}/USD) · account: ${state.account==='ALL'?'All':ACCT_NAME(state.account)}`;
  renderTabs();
  let html='';
  if(isBlank() && activeTab!=='operations') html=viewEmpty();
  else if(activeTab==='master') html=viewMaster(m);
  else if(activeTab==='accounts') html=viewAccounts(m);
  else if(activeTab==='analysis') html=viewAnalysis(m);
  else if(activeTab==='pnl') html=viewPnL(m);
  else if(activeTab==='income') html=viewIncome(m);
  else if(activeTab==='risk') html=viewRisk(m);
  else if(activeTab==='operations') html=viewOperations(m);
  else if(activeTab==='eqGlobal') html=viewEquities(m.eg,'Global Equities');
  else if(activeTab==='eqArg') html=viewEquities(m.ea,'Argentine Equities (ARS)');
  else if(activeTab==='bondsIntl') html=viewBonds(m.bi,'International Bonds','US Treasuries & corporates');
  else if(activeTab==='bondsArg') html=viewBonds(m.ba,'Argentine Bonds','hard-dollar (GD30/AL30) & CER/ARS');
  else if(activeTab==='funds') html=viewFunds(m.fn);
  else if(activeTab==='structured') html=viewStructured(m.st);
  else if(activeTab==='options') html=viewOptions(m.op);
  else if(activeTab==='futures') html=viewFutures(m.fu);
  else if(activeTab==='loans') html=viewLoans(m.ln);
  else if(activeTab==='cash') html=viewCash(m.ch);
  else if(activeTab==='ledger') html=viewLedger();
  document.getElementById('views').innerHTML=`<div class="view active">${html}</div>`;
  if(activeTab==='analysis') computeRange();
  renderFxBar();
}

function renderFxBar(){
  const f=state.fx, ars=f.ars_rates;
  const live = state.fxSource==='live';
  const cleanDate = (state.fxDate||'').replace(/\s*\((live|seed)\)\s*/i,'').trim();
  const badge = live
    ? `<span class="pill" style="background:transparent;border-color:var(--good);color:var(--good)"><span class="dot" style="background:var(--good)"></span>LIVE</span>`
    : `<span class="pill" style="background:transparent;border-color:var(--muted);color:var(--muted)"><span class="dot" style="background:var(--muted)"></span>SEED</span>`;
  document.getElementById('fxbar').innerHTML=
    `<span>${badge} <span class="muted">Rates as of ${cleanDate}</span></span>`+
    `<span>EUR/USD <b>${f.EUR_per_USD.toFixed(4)}</b></span>`+
    `<span>Oficial <b>${fmtNum(ars.oficial)}</b></span>`+
    `<span>MEP <b>${fmtNum(ars.mep)}</b></span>`+
    `<span>CCL <b>${fmtNum(ars.ccl)}</b></span>`+
    `<span>Blue <b>${fmtNum(ars.blue)}</b></span>`+
    `<span class="muted">Using <b>${state.arsRate.toUpperCase()}</b> ${fmtNum(ars[state.arsRate])}/USD</span>`;
}

/* ---------------- live FX ---------------- */
async function refreshFX(){
  const btn=document.getElementById('refreshBtn'); btn.textContent='↻ …'; btn.disabled=true;
  let ok=false;
  try{
    const r=await fetch('https://dolarapi.com/v1/dolares',{cache:'no-store'});
    if(r.ok){
      const arr=await r.json();
      const map={oficial:'oficial',blue:'blue',bolsa:'mep',contadoconliqui:'ccl',mayorista:'mayorista'};
      arr.forEach(d=>{ if(map[d.casa] && d.venta) state.fx.ars_rates[map[d.casa]]=d.venta; });
      ok=true;
    }
  }catch(e){}
  try{
    const r2=await fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP',{cache:'no-store'});
    if(r2.ok){ const j=await r2.json(); if(j.rates){ if(j.rates.EUR) state.fx.EUR_per_USD=j.rates.EUR; if(j.rates.GBP) state.fx.GBP_per_USD=j.rates.GBP; state.fxDate=j.date+' (live)'; } ok=true; }
  }catch(e){}
  state.fxSource = ok?'live':'seed';
  if(ok && !state.fxDate.includes('live')) state.fxDate=today().toISOString().slice(0,10)+' (live)';
  btn.textContent='↻ Refresh live FX'; btn.disabled=false;
  render();
}

/* ---------------- events ---------------- */
document.getElementById('ccySeg').addEventListener('click',e=>{
  if(e.target.dataset.ccy){ state.ccy=e.target.dataset.ccy;
    document.querySelectorAll('#ccySeg button').forEach(b=>b.classList.toggle('active',b.dataset.ccy===state.ccy));
    render(); }
});
document.getElementById('arsSel').value=state.arsRate;
document.getElementById('arsSel').addEventListener('change',e=>{state.arsRate=e.target.value;render();});
// populate account filter
(function(){
  const sel=document.getElementById('acctSel');
  sel.innerHTML='<option value="ALL">All accounts</option>'+
    (DATA.accounts||[]).map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  sel.value=state.account;
  sel.addEventListener('change',e=>{state.account=e.target.value;render();});
})();
document.getElementById('refreshBtn').addEventListener('click',refreshFX);
document.getElementById('themeBtn').addEventListener('click',()=>{
  const h=document.documentElement; h.dataset.theme = h.dataset.theme==='dark'?'light':'dark'; render();
});
// dark-first: keep the default dark theme unless the OS explicitly prefers light
if(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
  document.documentElement.dataset.theme='light';

document.getElementById('footnote').innerHTML=
  'Live FX pulls from dolarapi.com (ARS: oficial/MEP/CCL/blue/mayorista) and frankfurter.dev (EUR/GBP) directly in your browser — no key needed. '+
  'If a fetch is blocked, the dashboard falls back to the seeded rates shown. Instrument prices (equities, bonds, options, futures) are the template inputs — '+
  'edit them in the Excel workbook, which is the data engine this view mirrors. This is sample data for you to replace with your real positions.';

render();
// attempt a live refresh on load (non-blocking)
refreshFX();
